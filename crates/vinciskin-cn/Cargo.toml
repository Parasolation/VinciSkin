[package]
name = "vinciskin-cn"
version = "0.1.0"
edition = "2021"
description = "Chinese-server League install discovery and catalog alignment"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# 0.55 to match vinciskin-core's pin, so the workspace carries one winreg.
winreg = { version = "0.55", optional = true }

[features]
default = ["winreg"]
